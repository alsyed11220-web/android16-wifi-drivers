name: Infinix-WiFi-V5

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_v5:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zstd lz4 clang lld llvm

      - name: Clone Kernel Source Direct
        run: |
          S1="https://android."
          S2="://googlesource.com"
          git clone --depth=1 -b android16-6.12 "${S1}${S2}" kernel || true
          if [ ! -d "kernel/drivers" ]; then
            G1="https://github.com"
            G2="/android/kernel-common.git"
            git clone --depth=1 -b android16-6.12 "${G1}${G2}" kernel
          fi

      - name: Configure WiFi Drivers
        working-directory: kernel
        run: |
          make ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --set-str CONFIG_LOCALVERSION "-5-gb575a0b6e647-ab14355190-4k"
          ./scripts/config -d CONFIG_LOCALVERSION_AUTO
          ./scripts/config -d CONFIG_MODULE_SIG
          ./scripts/config -d CONFIG_MODVERSIONS
          ./scripts/config -m CONFIG_MT7601U
          ./scripts/config -m CONFIG_RT2X00
          ./scripts/config -m CONFIG_RT2800USB
          ./scripts/config -m CONFIG_RTL8XXXU
          ./scripts/config -m CONFIG_MT76x2U
          ./scripts/config -m CONFIG_ATH9K_HTC
          make ARCH=arm64 LLVM=1 olddefconfig

      - name: Compile WiFi Modules (.ko)
        working-directory: kernel
        run: |
          make ARCH=arm64 LLVM=1 -j$(nproc) modules_prepare
          make ARCH=arm64 LLVM=1 -j$(nproc) M=drivers/net/wireless modules
          mkdir -p ../ready_v5
          find drivers/net/wireless -name "*.ko" -exec cp {} ../ready_v5/ \;
          ls -lh ../ready_v5/

      - name: Upload WiFi Modules
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-WiFi-Modules-V5
          path: ready_v5/*.ko
          